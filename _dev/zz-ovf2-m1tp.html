<!doctype html><meta charset="utf-8"><body><pre id="out"></pre>
<script>
const p = new URLSearchParams(location.search);
try { localStorage.setItem('amp-iskra-trainer-v1', JSON.stringify({ v: 1, name: 'x', group: '', trust: 50, xp: 0, facts: {}, notes: '', stages: {}, decisions: [], log: [], teacher: true, started: null })); } catch (e) {}
const f = document.createElement('iframe'); f.style.width = '390px'; f.style.height = '3000px'; f.src = '../index.html#s-' + p.get('id'); document.body.appendChild(f);
f.onload = () => setTimeout(() => {
  const d = f.contentDocument;
  d.head.insertAdjacentHTML('beforeend', '<style>.wrap{grid-template-columns:minmax(0,1fr)}</style>');
  setTimeout(() => {
    const res = ['scrollW=' + d.documentElement.scrollWidth];
    const all = Array.from(d.querySelectorAll('#view *')).filter(e => e.scrollWidth > e.clientWidth + 2 && e.clientWidth > 0 && getComputedStyle(e).overflowX === 'visible');
    const deep = all.filter(e => !all.some(c => c !== e && e.contains(c)));
    deep.slice(0, 30).forEach(e => res.push(e.tagName + '.' + e.className + ' cw=' + e.clientWidth + ' sw=' + e.scrollWidth + ' :: ' + (e.textContent || '').slice(0, 70).replace(/\s+/g, ' ')));
    const scrollers = Array.from(d.querySelectorAll('#view *')).filter(e => e.scrollWidth > e.clientWidth + 2 && ['auto','scroll'].includes(getComputedStyle(e).overflowX));
    scrollers.forEach(e => res.push('SCROLLBOX ' + e.className + ' cw=' + e.clientWidth + ' sw=' + e.scrollWidth));
    document.getElementById('out').textContent = '@@' + res.join('\n') + '@@';
  }, 300);
}, 1500);
</script>
